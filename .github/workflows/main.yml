name: SKey CI/CD

# 1. Trigger: Run on every push to the 'main' branch
on:
  push:
    branches: [ "main" ]
    
# Grant permission to create releases
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest # Use Windows environment (required for Visual Studio MSBuild)

    steps:
    # Step A: Checkout code from the repository
    - uses: actions/checkout@v3

    # Step B: Display Author Information (Task 1.1)
    - name: Print Author Info
      run: echo "Commit was made by ${{ github.actor }}"

    # Step C: Setup MSBuild (Visual Studio Compiler)
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    # Step D: Build Application (Task 1.2)
    # Automatically finds the .sln file and builds it in Release mode
    - name: Build Application
      run: msbuild -p:Configuration=Release

    # Step E: Create and Publish Release (Task 1.3)
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        # Generate a unique tag based on the run number (e.g., v1.0.5)
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        # Path to the compiled .exe file
        files: |
          x64/Release/*.exe
          Release/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
